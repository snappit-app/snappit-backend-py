<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>Snappit activation code</title>
 </head>
 <body
  style="
   margin: 0;
   padding: 0;
   background-color: #f4f4f5;
   font-family:
    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica,
    Arial, sans-serif;
   color: #252528;
  "
 >
  <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">
   Your Snappit activation code is {{activation_code}}
  </div>
  <table
   role="presentation"
   width="100%"
   cellpadding="0"
   cellspacing="0"
   style="background-color: #f4f4f5"
  >
   <tr>
    <td align="center" style="padding: 40px 16px">
     <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px"
     >
      <tr>
       <td
        style="
         background-color: #ffffff;
         border: 1px solid #e7e7e9;
         border-radius: 16px;
         padding: 36px 36px 32px 36px;
        "
       >
        <h1
         style="
          margin: 0 0 10px 0;
          font-size: 20px;
          line-height: 1.3;
          color: #252528;
          font-weight: 600;
          letter-spacing: -0.3px;
         "
        >
         Your activation code
        </h1>
        <p
         style="
          margin: 0 0 24px 0;
          font-size: 15px;
          line-height: 1.6;
          color: #6b6b70;
         "
        >
         Enter the code below in the app to activate your license.
        </p>

        <div
         style="
          background-color: #f4f4f5;
          border: 1px solid #e7e7e9;
          border-radius: 12px;
          padding: 12px;
          text-align: center;
         "
        >
         <input
          readonly
          value="{{activation_code}}"
          style="
           font-size: 18px;
           font-weight: 600;
           letter-spacing: 2px;
           color: #629dff;
           font-family:
            &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;,
            Menlo, monospace;
           border: none;
           background: transparent;
           text-align: center;
           width: 100%;
           outline: none;
          "
         />
        </div>

        <div style="text-align: center; padding-top: 28px">
         <a
          href="{{downloads_url}}"
          style="
           display: inline-block;
           background-color: #629dff;
           color: #ffffff;
           font-size: 15px;
           font-weight: 500;
           text-decoration: none;
           padding: 12px 24px;
           border-radius: 12px;
          "
         >
          Download Snappit
         </a>
         <p
          style="
           margin: 16px 0 0 0;
           font-size: 13px;
           line-height: 1.6;
           color: #9a9aa0;
          "
         >
          Or copy this link:<br />
          <a
           href="{{downloads_url}}"
           style="color: #629dff; text-decoration: none"
           >{{downloads_url}}</a
          >
         </p>
        </div>
       </td>
      </tr>
      <tr>
       <td style="padding: 20px 4px 0 4px">
        <p
         style="
          margin: 0;
          font-size: 12px;
          line-height: 1.6;
          color: #9a9aa0;
          text-align: center;
         "
        >
         If you didn't request this code, you can safely ignore this email.
        </p>
        <p
         style="
          margin: 16px 0 0 0;
          font-size: 12px;
          color: #b0b0b5;
          text-align: center;
         "
        >
         &copy; Snappit
        </p>
       </td>
      </tr>
     </table>
    </td>
   </tr>
  </table>
 </body>
</html>
